<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Juntar PDFs</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
  <style>
    :root { --bg: #f5f6f8; --surface: #fff; --border: #e2e5ea; --text: #1c2230; --muted: #667085; --accent: #2f6fed; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0f1218; --surface: #171b23; --border: #2a303b; --text: #e6e9ef; --muted: #98a2b3; --accent: #5b8ef5; }
    }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text);
      font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    form { width: min(380px, calc(100% - 32px)); padding: 24px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; }
    h1 { margin: 0 0 4px; font-size: 22px; }
    p { margin: 0 0 16px; color: var(--muted); }
    input { box-sizing: border-box; width: 100%; min-height: 38px; padding: 0 10px; margin-bottom: 10px; border: 1px solid var(--border);
      border-radius: 8px; background: var(--bg); color: var(--text); font: inherit; }
    button { width: 100%; min-height: 38px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>
  <form method="get" action="/">
    <h1>Juntar PDFs</h1>
    <p>Este endereço precisa de uma chave de acesso. Abra o link completo que você recebeu ou digite a chave abaixo.</p>
    <input name="chave" type="password" placeholder="Chave de acesso" autocomplete="off" required autofocus>
    <button type="submit">Entrar</button>
  </form>
</body>
</html>
